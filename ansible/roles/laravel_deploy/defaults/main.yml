---
# Default deployment path
deployment_path: /var/www/laravel-app

# Temporary directory for deployment package
deploy_temp_path: /tmp/laravel-deploy

# Rollback backup directory
rollback_backup_path: /var/www/laravel-app-backups

# Number of backups to keep (older backups will be deleted)
rollback_keep_backups: 5

# Deployment package filename (will be passed from Jenkins)
deploy_package: "{{ deploy_package | default('laravel-app.zip') }}"

# Full path to deployment package on Jenkins server (will be passed from Jenkins)
deploy_package_path: "{{ deploy_package_path | default('') }}"

# Git branch mapping by environment (kept for reference, not used in zip deployment)
git_branches:
  develop: deve
  staging: staging
  production: main

# Get git branch based on environment
git_branch: "{{ git_branches[env] | default('deve') }}"

# App environment mapping
app_env_mapping:
  develop: local
  staging: staging
  production: production

# Get app_env based on environment
app_env: "{{ app_env_mapping[env] | default('local') }}"

# Debug mode by environment
app_debug_mapping:
  develop: "true"
  staging: "true"
  production: "false"

app_debug: "{{ app_debug_mapping[env] | default('true') }}"


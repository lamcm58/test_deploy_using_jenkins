[defaults]
# Inventory file location
inventory = inventory

# SSH connection settings for EC2
host_key_checking = False
timeout = 30
retry_files_enabled = False

# SSH private key file (uncomment and set path if using key file)
# private_key_file = ~/.ssh/your-ec2-key.pem

# Ansible user (can be overridden in inventory)
# remote_user = ubuntu

# Become settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Logging
log_path = /tmp/ansible.log

[ssh_connection]
# SSH connection settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

